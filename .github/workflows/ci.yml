name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Buena parte del dominio razona en días y semanas LOCALES (plan diario,
      # tope de tarjetas, racha, plan semanal). Correr la suite en las dos zonas
      # extremas hace visible cualquier cálculo o test que use el día UTC sin
      # querer: con el runner en UTC, esos errores pasan en verde.
      - name: test (zonas horarias extremas)
        run: |
          TZ=Pacific/Kiritimati npm test
          TZ=Pacific/Pago_Pago npm test
      - run: npm run verify:patrones
      - run: npm run verify:finales
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E (base /)
        run: |
          npm run build
          npm run e2e
      - name: E2E (base /ajedrez/, como GitHub Pages)
        run: |
          npm run build
          npm run e2e
        env:
          BASE_PATH: /ajedrez/
